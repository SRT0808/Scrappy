name: Probe extractor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrappy-check-prices
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Start timing
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install dependencies
        run: python -m pip install ./scraper

      - name: Identify browser versions
        id: browser-versions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version
          print(f"key={version('playwright')}-{version('patchright')}")
          PY

      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-browsers-${{ steps.browser-versions.outputs.key }}-${{ hashFiles('scraper/pyproject.toml') }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: scrapling install

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Test affected scraper code
        run: |
          python -m unittest discover -s scraper/tests -p test_extract.py -v
          python -m unittest discover -s scraper/tests -p test_probe.py -v
          python -m unittest discover -s scraper/tests -p test_recipes.py -v

      - name: Verify adaptive JSON persistence through Supabase in a fresh process
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPPY_TEST_SUPABASE: '1'
        run: python -m unittest discover -s scraper/tests -p test_recipes.py -k test_supabase_adaptive_round_trip_in_new_process -v

      - name: Evaluate the same 15 products and remember successful domain modes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scrappy.probe scraper/urls.txt --output .scrappy/actions.json --persist-recipes --compare scraper/results/local.json

      - name: Upload report and HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            .scrappy/actions.json
            .scrappy/actions.md
            .scrappy/actions-evidence/
          retention-days: 7

      - name: Report runner time and cache
        if: always()
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED_AT ))
          echo "Probe: ${elapsed}s de runner; caché de navegadores: ${{ steps.browsers.outputs.cache-hit }}. Consulta por separado el consumo facturado." >> "$GITHUB_STEP_SUMMARY"
