name: Check prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de ejecucion
        type: choice
        options:
          - all
          - product
          - reading
          - test_notification
        default: all
        required: true
      product_id:
        description: ID del producto (obligatorio en modo product)
        type: string
        required: false
      reading_id:
        description: ID de lectura (obligatorio en modo reading)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: scrappy-check-prices
  cancel-in-progress: false

jobs:
  check-prices:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - name: Start timing
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate heartbeat configuration
        if: inputs.mode != 'reading'
        run: |
          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "Falta el secreto HEALTHCHECK_URL." >&2
            exit 1
          fi
          if [[ "$HEALTHCHECK_URL" != https://hc-ping.com/* ]]; then
            echo "HEALTHCHECK_URL debe ser la URL HTTPS de ping de Healthchecks.io." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install dependencies
        run: python -m pip install ./scraper

      - name: Identify browser versions
        id: browser-versions
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from importlib.metadata import version
          print(f"key={version('playwright')}-{version('patchright')}")
          PY

      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-browsers-${{ steps.browser-versions.outputs.key }}-${{ hashFiles('scraper/pyproject.toml') }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: scrapling install

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Review products and send notifications
        id: review
        env:
          RUN_MODE: ${{ inputs.mode || 'all' }}
          PURCHASE_APP_ORIGIN: ${{ secrets.PURCHASE_APP_ORIGIN }}
          PRODUCT_ID: ${{ inputs.product_id }}
          READING_ID: ${{ inputs.reading_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python -m scrappy.run --mode "$RUN_MODE" --product-id "$PRODUCT_ID" --reading-id "$READING_ID"

      # Deployment opt-in only. Run after a failed review too: it may have
      # committed prices before failing. Never mask that original failure.
      - name: Set up Node for alternatives
        id: purchase_node
        if: >-
          !cancelled() && vars.PURCHASE_WORKER_ENABLED == 'true' &&
          (inputs.mode == '' || inputs.mode == 'all' || inputs.mode == 'product') &&
          (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build alternatives runtime
        id: purchase_build
        if: >-
          !cancelled() && steps.purchase_node.outcome == 'success'
        run: |
          npm ci --no-audit --no-fund
          npx tsc

      - name: Recalculate alternatives and deliver pending notices
        if: >-
          !cancelled() && steps.purchase_build.outcome == 'success'
        env:
          PURCHASE_WORKER_ENABLED: ${{ vars.PURCHASE_WORKER_ENABLED }}
          RUN_MODE: ${{ inputs.mode || 'all' }}
          PURCHASE_DATABASE_URL: ${{ secrets.PURCHASE_DATABASE_URL }}
          PURCHASE_DATABASE_CA: ${{ secrets.PURCHASE_DATABASE_CA }}
          PURCHASE_APP_ORIGIN: ${{ secrets.PURCHASE_APP_ORIGIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: node .scrappy/api-build/scripts/purchase-actions.js

      - name: Ping heartbeat
        if: success() && inputs.mode != 'reading'
        run: curl --fail --silent --output /dev/null --max-time 15 --retry 2 "${HEALTHCHECK_URL%/}"

      - name: Ping failure
        if: failure() && inputs.mode != 'reading' && env.HEALTHCHECK_URL != ''
        run: curl --fail --silent --output /dev/null --max-time 15 --retry 2 "${HEALTHCHECK_URL%/}/fail"

      - name: Report elapsed runner time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED_AT ))
          echo "Tiempo transcurrido del runner: ${elapsed}s. Consulta el consumo facturado en GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
