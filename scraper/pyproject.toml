[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrappy"
version = "0.1.0"
description = "Personal price tracker scraper"
requires-python = ">=3.11"
dependencies = ["scrapling[fetchers]==0.4.15"]

[tool.setuptools.packages.find]
where = ["src"]
